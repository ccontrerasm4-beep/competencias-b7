<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002244" />
      <stop offset="60%" stop-color="#003366" />
      <stop offset="100%" stop-color="#004c8c" />
    </linearGradient>
    <linearGradient id="acentoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ffa040" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo base -->
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- Patrones geométricos decorativos -->
  <circle cx="720" cy="80" r="140" fill="none" stroke="rgba(255, 123, 0, 0.15)" stroke-width="2" />
  <circle cx="720" cy="80" r="200" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="100" cy="360" r="160" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />
  
  <!-- Olas de tecnología de fondo -->
  <path d="M0,320 C180,360 300,280 480,330 C640,370 720,310 800,340 L800,400 L0,400 Z" fill="rgba(255, 123, 0, 0.1)" />
  <path d="M0,350 C220,380 400,320 600,360 C700,380 750,370 800,380 L800,400 L0,400 Z" fill="rgba(0, 18, 38, 0.5)" />

  <!-- Tarjeta flotante con ilustración gráfica a la derecha -->
  <g transform="translate(480, 50)">
    <rect x="0" y="0" width="270" height="270" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <!-- Gráfica de crecimiento de barras -->
    <rect x="40" y="160" width="28" height="60" rx="4" fill="#ffffff" fill-opacity="0.3" />
    <rect x="80" y="130" width="28" height="90" rx="4" fill="#ffffff" fill-opacity="0.5" />
    <rect x="120" y="90" width="28" height="130" rx="4" fill="#ffffff" fill-opacity="0.75" />
    <rect x="160" y="60" width="28" height="160" rx="4" fill="url(#acentoGrad)" filter="url(#glow)" />
    
    <!-- Línea de tendencia ascendente -->
    <path d="M50,150 L95,115 L135,75 L175,45" fill="none" stroke="#ffaa40" stroke-width="4" stroke-linecap="round" />
    <circle cx="175" cy="45" r="6" fill="#ffffff" stroke="#ff7b00" stroke-width="3" />

    <!-- Icono de bombilla de ideas / emprendimiento -->
    <g transform="translate(200, 30)">
      <circle cx="18" cy="18" r="22" fill="#ff7b00" fill-opacity="0.2" />
      <path d="M18,6 C11.4,6 6,11.4 6,18 C6,22.1 8.1,25.7 11.3,27.8 L11.3,31 C11.3,31.6 11.7,32 12.3,32 L23.7,32 C24.3,32 24.7,31.6 24.7,31 L24.7,27.8 C27.9,25.7 30,22.1 30,18 C30,11.4 24.6,6 18,6 Z" fill="#ffffff" />
      <rect x="13" y="34" width="10" height="2" rx="1" fill="#ffa040" />
    </g>
  </g>

  <!-- Insignia "PORTADA OFICIAL" -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="165" height="30" rx="15" fill="rgba(255, 123, 0, 0.2)" stroke="#ff7b00" stroke-width="1.5" />
    <circle cx="15" cy="15" r="5" fill="#ff7b00" />
    <text x="28" y="20" fill="#ffaa40" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">COLEGIO · 1.º BGU</text>
  </g>

  <!-- Título principal -->
  <text x="50" y="145" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    EMPRENDIMIENTO
  </text>
  <text x="50" y="190" fill="#ffa040" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Y GESTIÓN
  </text>

  <!-- Subtítulo y descripción -->
  <text x="50" y="235" fill="rgba(255, 255, 255, 0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
    Conceptos financieros, contabilidad básica y desarrollo de proyectos
  </text>
  <text x="50" y="260" fill="rgba(255, 255, 255, 0.6)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">
    Plataforma de Aprendizaje Interactivo y Gamificación
  </text>

  <!-- Píldoras de temas clave -->
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="95" height="26" rx="13" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="12" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">📊 Finanzas</text>

    <rect x="105" y="0" width="100" height="26" rx="13" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="117" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">💡 Innovación</text>

    <rect x="215" y="0" width="90" height="26" rx="13" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="227" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">🚀 Proyectos</text>
  </g>
</svg>
